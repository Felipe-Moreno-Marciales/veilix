# Integración continua de Veilix: tipos, lint, pruebas y compilaciones.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - name: Instalar Chromium, Firefox y WebKit (Playwright)
        run: npm run navegador:instalar
      # WebKit de Playwright comparte motor con Safari, pero no es Safari.
      - run: npm run test:navegador

  compilar:
    name: Compilar (${{ matrix.navegador }})
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `chrome` sirve también para Brave, Opera y Vivaldi.
        # `safari` solo se compila aquí; ver el trabajo `safari-macos`.
        navegador: [chrome, edge, firefox, safari]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.navegador }}
      - name: Validar paquete de Firefox
        if: matrix.navegador == 'firefox'
        run: npm run lint:firefox
      - name: Verificar la extensión compilada en Chromium
        if: matrix.navegador == 'chrome'
        run: |
          npx playwright install --with-deps chromium
          npm run test:extension
      - name: Publicar capturas del panel
        if: matrix.navegador == 'chrome'
        uses: actions/upload-artifact@v7
        with:
          name: veilix-capturas
          path: .output/capturas
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: veilix-${{ matrix.navegador }}-mv3
          path: .output/${{ matrix.navegador }}-mv3
          retention-days: 7
          if-no-files-found: error

  # Experimental y manual: valida el paquete de Safari con la herramienta
  # oficial de Apple y compila la app contenedora sin firmar. NO ejecuta la
  # extensión en Safari ni prueba WhatsApp Web.
  safari-macos:
    name: Empaquetar para Safari (macOS, experimental)
    if: github.event_name == 'workflow_dispatch'
    needs: verificar
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:safari
      - name: Generar el proyecto de Xcode
        # `shell: bash` activa `pipefail`, para que `tee` no oculte los errores.
        shell: bash
        run: |
          herramienta=safari-web-extension-packager
          xcrun --find "$herramienta" >/dev/null 2>&1 || herramienta=safari-web-extension-converter
          xcrun "$herramienta" .output/safari-mv3 \
            --project-location "$RUNNER_TEMP/veilix-safari" \
            --app-name Veilix \
            --bundle-identifier app.veilix.Veilix \
            --swift --macos-only --copy-resources \
            --no-open --no-prompt --force 2>&1 | tee "$RUNNER_TEMP/empaquetador.log"
      - name: Compilar la app sin firmar
        shell: bash
        run: |
          proyecto="$(find "$RUNNER_TEMP/veilix-safari" -name '*.xcodeproj' -maxdepth 3 | head -n 1)"
          xcodebuild -project "$proyecto" -alltargets -configuration Release \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: veilix-safari-registros
          path: |
            ${{ runner.temp }}/empaquetador.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
